[project]
name = "hkd-maskedkd"
version = "0.1.0"
description = "Paired HKD experiments with DeiT-B teacher masking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm==1.0.19",
    "Pillow>=10,<12",
    "numpy>=1.26,<3",
    "pycocotools>=2.0.7,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
required-version = ">=0.9"
package = false
no-build = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
